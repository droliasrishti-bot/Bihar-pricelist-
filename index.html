<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Agrichem Price Board — Bihar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board-bg:#173428;
    --board-bg-dark:#0e2019;
    --board-line: rgba(244,241,232,0.10);
    --chalk-white:#f4f1e8;
    --chalk-dim: rgba(244,241,232,0.55);
    --chalk-amber:#f2c14e;
    --chalk-amber-dim:#c9a03e;
    --brick:#d1495b;
    --sage:#8fae7d;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1e4433 0%, var(--board-bg) 55%),
      var(--board-bg);
    color:var(--chalk-white);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative; z-index:1;
    max-width:600px;
    margin:0 auto;
    padding:20px 16px 100px;
  }
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .title-block{flex:1;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--chalk-amber-dim);
    margin:0 0 4px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.01em;
    margin:0;
    color:var(--chalk-white);
  }
  .sync{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--chalk-dim);
    margin-top:6px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--chalk-amber);
    box-shadow:0 0 0 0 rgba(242,193,78,0.6);
    animation:pulse 2.2s infinite;
    flex-shrink:0;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(242,193,78,0.5);}
    70%{box-shadow:0 0 0 7px rgba(242,193,78,0);}
    100%{box-shadow:0 0 0 0 rgba(242,193,78,0);}
  }
  .lock-btn{
    background:var(--board-bg-dark);
    border:1px solid var(--board-line);
    color:var(--chalk-white);
    width:42px;height:42px;
    border-radius:12px;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:border-color .15s, background .15s;
  }
  .lock-btn:hover{border-color:var(--chalk-amber-dim);}
  .lock-btn.unlocked{
    background:rgba(242,193,78,0.12);
    border-color:var(--chalk-amber-dim);
    color:var(--chalk-amber);
  }
  .search{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--board-line);
    background:var(--board-bg-dark);
    color:var(--chalk-white);
    font-family:'Inter',sans-serif;
    font-size:14px;
    margin-bottom:12px;
    outline:none;
  }
  .search::placeholder{color:var(--chalk-dim);}
  .search:focus{border-color:var(--chalk-amber-dim);}

  .meta-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--chalk-dim);
    margin-bottom:14px;
  }

  .admin-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(242,193,78,0.10);
    border:1px solid rgba(242,193,78,0.3);
    color:var(--chalk-amber);
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:9px 12px;
    border-radius:10px;
    margin-bottom:14px;
  }
  .admin-banner button{
    background:none;border:none;color:var(--chalk-amber);
    font-family:'JetBrains Mono',monospace;
    font-size:11px; text-decoration:underline;
    cursor:pointer; padding:0;
  }

  .category{
    margin-bottom:12px;
    border:1px solid var(--board-line);
    border-radius:var(--radius);
    overflow:hidden;
    background:rgba(0,0,0,0.08);
  }
  .cat-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px;
    cursor:pointer;
    user-select:none;
  }
  .cat-header:hover{background:rgba(255,255,255,0.02);}
  .cat-title{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--chalk-white);
  }
  .cat-count{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--chalk-dim);
    margin-left:8px;
  }
  .cat-chevron{
    font-size:12px; color:var(--chalk-dim);
    transition:transform .15s;
  }
  .cat-header.open .cat-chevron{transform:rotate(90deg);}
  .cat-body{display:none;}
  .cat-body.open{display:block;}

  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-top:1px solid var(--board-line);
  }
  .row-main{flex:1; min-width:0;}
  .p-name{
    font-size:14.5px;
    font-weight:600;
    color:var(--chalk-white);
    display:flex; align-items:center; gap:6px;
    flex-wrap:wrap;
  }
  .p-ai{
    font-size:11px;
    color:var(--chalk-dim);
    margin-top:2px;
    line-height:1.3;
  }
  .p-pack{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--chalk-amber-dim);
    margin-top:3px;
  }
  .badge-updated{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    letter-spacing:0.05em;
    background:rgba(209,73,91,0.18);
    color:var(--brick);
    border:1px solid rgba(209,73,91,0.4);
    padding:2px 6px;
    border-radius:5px;
    text-transform:uppercase;
  }
  .p-price-block{
    text-align:right;
    flex-shrink:0;
  }
  .p-price{
    font-family:'Oswald',sans-serif;
    font-size:19px;
    font-weight:600;
    color:var(--chalk-amber);
    letter-spacing:0.01em;
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }
  .p-price-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--chalk-dim);
    margin-top:2px;
  }
  .row-actions{
    display:flex; gap:6px; flex-shrink:0;
  }
  .icon-btn{
    width:32px;height:32px;
    border-radius:9px;
    border:1px solid var(--board-line);
    background:var(--board-bg-dark);
    color:var(--chalk-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:13px;
  }
  .icon-btn:hover{color:var(--chalk-white); border-color:var(--chalk-amber-dim);}
  .icon-btn.danger:hover{color:var(--brick); border-color:var(--brick);}

  .edit-row{padding:12px 14px; border-top:1px solid var(--board-line);}
  .edit-row.new{border-top:none;}
  .field-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--chalk-dim);
    margin:0 0 4px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .field-wrap{margin-bottom:8px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  input.field, select.field{
    width:100%;
    background:var(--board-bg-dark);
    border:1px solid var(--board-line);
    color:var(--chalk-white);
    border-radius:8px;
    padding:9px 10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    outline:none;
  }
  input.field:focus, select.field:focus{border-color:var(--chalk-amber-dim);}
  .edit-actions{display:flex; gap:8px; margin-top:4px;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px; font-weight:600;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn-save{background:var(--chalk-amber); color:#1b2a1f; flex:1;}
  .btn-cancel{background:none; border-color:var(--board-line); color:var(--chalk-dim);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--chalk-dim);
  }
  .empty .big{font-size:36px; margin-bottom:8px;}
  .empty p{font-size:14px; line-height:1.5; max-width:280px; margin:0 auto;}

  .fab{
    position:fixed;
    bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--chalk-amber);
    color:#1b2a1f;
    border:none;
    border-radius:14px;
    padding:14px 22px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    z-index:5;
  }

  .toast{
    position:fixed;
    top:16px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--chalk-white);
    color:#173428;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 18px;
    border-radius:10px;
    transition:transform .25s ease;
    z-index:20;
    max-width:88vw;
    text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(10,20,15,0.7);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:30;
  }
  .modal{
    background:var(--board-bg-dark);
    border:1px solid var(--board-line);
    border-radius:16px;
    padding:24px;
    width:100%; max-width:320px;
    text-align:center;
  }
  .modal h2{
    font-family:'Oswald',sans-serif;
    font-size:18px; font-weight:600;
    margin:0 0 6px;
  }
  .modal p{
    font-size:13px; color:var(--chalk-dim); margin:0 0 18px; line-height:1.5;
  }
  .pin-input{
    width:100%;
    background:var(--board-bg);
    border:1px solid var(--board-line);
    color:var(--chalk-white);
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    letter-spacing:0.3em;
    text-align:center;
    padding:12px;
    border-radius:10px;
    margin-bottom:14px;
    outline:none;
  }
  .pin-input:focus{border-color:var(--chalk-amber-dim);}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions .btn{flex:1;}
  .modal-error{color:var(--brick); font-size:12px; margin:-8px 0 12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <p class="eyebrow">Agrichem &middot; Bihar &amp; Jharkhand Rate Sheet</p>
      <h1>Price Board</h1>
      <div class="sync"><span class="dot"></span><span id="syncText">connecting…</span></div>
    </div>
    <button class="lock-btn" id="lockBtn" title="Boss mode">🔒</button>
  </header>

  <div id="adminBanner" style="display:none" class="admin-banner">
    <span>BOSS MODE — you can edit prices</span>
    <button id="exitAdmin">exit</button>
  </div>

  <input type="text" class="search" id="search" placeholder="Search product, active ingredient, or pack size…">
  <div class="meta-row"><span id="countText"></span><span id="updatedFilterHint"></span></div>

  <div class="category" id="newProductSlot"></div>
  <div id="board"></div>
</div>

<button class="fab" id="addFab" style="display:none">+ Add product</button>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

function relTime(ts){
  if(!ts) return 'never';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s < 10) return 'just now';
  if(s < 60) return s+'s ago';
  const m = Math.floor(s/60);
  if(m < 60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

const DB_URL = 'https://agrichem-price-list-default-rtdb.firebaseio.com/';

async function dbGet(key){
  const r = await fetch(DB_URL + key + '.json?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('db read failed');
  return r.json(); // null if key doesn't exist yet
}
async function dbSet(key, val){
  const r = await fetch(DB_URL + key + '.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(val)});
  if(!r.ok) throw new Error('db write failed');
}

async function loadCatalog(silent){
  try{
    const SEED_VERSION = 3;
    const parsed = await dbGet('catalogBihar');
    if(parsed && (parsed.seedVersion || 1) >= SEED_VERSION && parsed.products && parsed.products.length){
      products = parsed.products;
      lastUpdated = parsed.lastUpdated || null;
    } else {
      // first run: seed the database with the official price list
      products = RAW_SEED;
      lastUpdated = Date.now();
      await dbSet('catalogBihar', {products, lastUpdated, seedVersion: SEED_VERSION});
    }
    syncText.textContent = 'updated ' + relTime(lastUpdated);
  } catch(e){
    if(products.length === 0){ products = RAW_SEED; }
    if(!silent) syncText.textContent = 'offline — check internet';
  }
  render();
}

async function saveCatalog(){
  lastUpdated = Date.now();
  try{
    await dbSet('catalogBihar', {products, lastUpdated, seedVersion: 3});
    syncText.textContent = 'updated ' + relTime(lastUpdated);
  } catch(e){
    showToast('Could not save — check internet and try again');
  }
}

function packFraction(pack){
  if(!pack) return null;
  // find the first number + unit in the pack string, e.g. "500 ML", "250 GM", "1 LTR (PET)"
  const m = pack.match(/([\d.]+)\s*(ML|GM|LTR|LITRE|KG|L\b)/i);
  if(!m) return null;
  const qty = parseFloat(m[1]);
  if(Number.isNaN(qty)) return null;
  const unit = m[2].toUpperCase();
  if(unit === 'ML' || unit === 'GM') return qty / 1000;   // 500 ML -> 0.5
  return qty;                                            // 1 LTR / 1 KG -> 1, 10 KG -> 10
}

function computePackPrice(rate, pack){
  const f = packFraction(pack);
  if(f === null) return null;
  return Math.round(rate * f * 100) / 100;
}

// Official packing-difference table (rupees added to the 1 LTR/KG rate)
const PACK_DIFF = {
  'PET':   {0.5:15, 0.25:35, 0.1:80, 0.05:160, 5:-5},
  'ALM':   {0.5:20, 0.25:40, 0.1:95, 0.05:190, 5:-5},
  'HDPE':  {0.5:20, 0.25:35, 0.1:90, 0.05:170, 5:-5},
  'POUCH': {0.5:15, 0.25:30, 0.1:50, 0.05:110, 5:0},
  'BOX':   {0.5:15, 0.25:35, 0.1:90, 0.05:160, 5:0}
};
const PACK_TYPE_LABEL = {PET:'PET bottle', ALM:'ALM bottle / TIN', HDPE:'HDPE bottle', POUCH:'Pouch', BOX:'Box / Carton'};

function detectPackType(prod){
  // look at every pack string of this product for a packaging keyword
  const packs = products.filter(x => x.name === prod.name && x.category === prod.category).map(x => x.pack.toUpperCase());
  const all = packs.join(' ');
  if(all.includes('PET')) return 'PET';
  if(all.includes('ALM') || all.includes('TIN')) return 'ALM';
  if(all.includes('HDPE')) return 'HDPE';
  if(all.includes('POUCH') || all.includes('BAG')) return 'POUCH';
  if(all.includes('BOX') || all.includes('CTN') || all.includes('CARTON') || all.includes('DUPLEX') || all.includes('BKT') || all.includes('BUCKET') || all.includes('DRUM') || all.includes('JAR') || all.includes('CONT')) return 'BOX';
  return 'PET';
}

// which sibling packs would change if the base rate becomes baseRate
function cascadeTargets(prod, baseRate, type){
  const diffs = PACK_DIFF[type] || PACK_DIFF['PET'];
  const out = [];
  products.forEach(x => {
    if(x.name !== prod.name || x.category !== prod.category || x.id === prod.id) return;
    const f = packFraction(x.pack);
    if(f === null) return;
    const key = [0.5,0.25,0.1,0.05,5].find(k => Math.abs(k - f) < 1e-9);
    if(key === undefined) return;   // sizes not in the table (10ML, 25GM etc.) are left alone
    const newRate = Math.round((baseRate + diffs[key]) * 100) / 100;
    if(newRate !== x.price) out.push({row:x, newRate:newRate, diff:diffs[key]});
  });
  return out;
}

function applyCascade(targets, gstStr){
  const mult = gstStr === '5%' ? 1.05 : 1.18;
  targets.forEach(t => {
    t.row.price = t.newRate;
    const u = computePackPrice(t.newRate, t.row.pack);
    if(u != null) t.row.unitPrice = u;
    t.row.priceIncl = Math.round(t.newRate * mult * 100) / 100;
    t.row.updated = true;
  });
}

function showCascadeModal(prod, baseRate, gstStr, afterFn){
  let type = detectPackType(prod);
  function draw(){
    const targets = cascadeTargets(prod, baseRate, type);
    const typeOpts = Object.keys(PACK_DIFF).map(t => `<option value="${t}" ${t===type?'selected':''}>${PACK_TYPE_LABEL[t]}</option>`).join('');
    const listHtml = targets.length ? targets.map(t =>
        `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--board-line); font-size:12.5px;">
           <span style="color:var(--chalk-dim); font-family:'JetBrains Mono',monospace;">${escapeHtml(t.row.pack)}</span>
           <span><span style="color:var(--chalk-dim);">+${t.diff} →</span> <b style="color:var(--chalk-amber);">₹${formatPrice(t.newRate)}</b></span>
         </div>`).join('')
      : `<p style="color:var(--chalk-dim); font-size:12.5px; margin:6px 0;">No other pack sizes to update for this product.</p>`;
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" style="max-width:340px; text-align:left;">
          <h2>Update other pack sizes?</h2>
          <p style="margin-bottom:12px;">${escapeHtml(prod.name)} base rate is now <b style="color:var(--chalk-amber)">₹${formatPrice(baseRate)}</b>. Smaller packs can be set automatically using the packing difference.</p>
          <p class="field-label">Packing type</p>
          <select class="field" id="cascType" style="margin-bottom:10px;">${typeOpts}</select>
          <div style="max-height:190px; overflow-y:auto; margin-bottom:14px;">${listHtml}</div>
          <div class="modal-actions">
            <button class="btn btn-cancel" id="cascSkip">Only this pack</button>
            <button class="btn btn-save" id="cascGo" ${targets.length?'':'disabled'}>Update all</button>
          </div>
        </div>
      </div>`;
    document.getElementById('cascType').onchange = (e) => { type = e.target.value; draw(); };
    document.getElementById('cascSkip').onclick = () => { modalRoot.innerHTML=''; afterFn(false); };
    document.getElementById('cascGo').onclick = async () => {
      applyCascade(cascadeTargets(prod, baseRate, type), gstStr);
      modalRoot.innerHTML='';
      afterFn(true);
    };
  }
  draw();
}

function genId(){
  return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function formatPrice(v){
  const n = Number(v);
  if(Number.isNaN(n)) return v;
  return n.toLocaleString('en-IN', {maximumFractionDigits:2});
}

function matchesQuery(p, q){
  if(!q) return true;
  const hay = (p.name+' '+(p.ai||'')+' '+p.pack+' '+p.category).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render(){
  addFab.style.display = isAdmin ? 'flex' : 'none';
  adminBanner.style.display = isAdmin ? 'flex' : 'none';
  lockBtn.textContent = isAdmin ? '🔓' : '🔒';
  lockBtn.classList.toggle('unlocked', isAdmin);

  const filtered = products.filter(p => matchesQuery(p, query));
  countText.textContent = filtered.length + ' item' + (filtered.length===1?'':'s') + (query ? ' matching' : ' total');

  // group by category, preserving known order then any extras
  const byCat = {};
  filtered.forEach(p => {
    const c = p.category || 'Other';
    if(!byCat[c]) byCat[c] = [];
    byCat[c].push(p);
  });
  const cats = Object.keys(byCat).sort((a,b)=>{
    const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
    if(ia === -1 && ib === -1) return a.localeCompare(b);
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });

  // auto-open categories while searching
  if(query){ cats.forEach(c => openCategories.add(c)); }

  boardEl.innerHTML = '';

  if(cats.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    if(products.length === 0){
      empty.innerHTML = `<div class="big">📋</div><p>${isAdmin ? 'No products yet. Tap "+ Add product" below to list the first rate.' : 'No products on the board yet. Ask the boss to add rates.'}</p>`;
    } else {
      empty.innerHTML = `<div class="big">🔍</div><p>No product matches "${escapeHtml(query)}".</p>`;
    }
    boardEl.appendChild(empty);
    return;
  }

  cats.forEach(cat => {
    const catEl = document.createElement('div');
    catEl.className = 'category';
    const isOpen = openCategories.has(cat);
    const header = document.createElement('div');
    header.className = 'cat-header' + (isOpen ? ' open' : '');
    header.innerHTML = `<span class="cat-title">${escapeHtml(cat)}<span class="cat-count">${byCat[cat].length}</span></span><span class="cat-chevron">▸</span>`;
    header.onclick = () => {
      if(openCategories.has(cat)) openCategories.delete(cat); else openCategories.add(cat);
      render();
    };
    catEl.appendChild(header);

    const body = document.createElement('div');
    body.className = 'cat-body' + (isOpen ? ' open' : '');
    byCat[cat].forEach(p => {
      if(editingId === p.id){
        body.appendChild(renderEditRow(p, cat));
      } else {
        body.appendChild(renderRow(p));
      }
    });
    catEl.appendChild(body);
    boardEl.appendChild(catEl);
  });

  // new product form
  newProductSlot.innerHTML = '';
  newProductSlot.style.display = 'none';
  if(addingNew){
    newProductSlot.style.display = 'block';
    const wrap = document.createElement('div');
    wrap.appendChild(renderEditRow({id:'__new__', name:'', ai:'', pack:'', price:'', priceIncl:'', gst:'', category: CATEGORY_ORDER[0]}, null, true));
    newProductSlot.appendChild(wrap);
  }
}

function renderRow(p){
  const row = document.createElement('div');
  row.className = 'row';
  const gstLabel = p.gst ? p.gst + ' GST' : '+ GST';
  const subBits = [];
  if(p.unitPrice != null && p.unitPrice !== '') subBits.push('pack ₹' + formatPrice(p.unitPrice));
  if(p.priceIncl) subBits.push('₹' + formatPrice(p.priceIncl) + ' incl.');
  row.innerHTML = `
    <div class="row-main">
      <div class="p-name">${escapeHtml(p.name)}${p.updated ? '<span class="badge-updated">updated</span>' : ''}</div>
      ${p.ai ? `<div class="p-ai">${escapeHtml(p.ai)}</div>` : ''}
      <div class="p-pack">${escapeHtml(p.pack)}</div>
    </div>
    <div class="p-price-block">
      <div class="p-price">₹${formatPrice(p.price)}</div>
      <div class="p-price-sub">per LTR/KG ${gstLabel}</div>
      ${subBits.length ? `<div class="p-price-sub">${subBits.join(' &middot; ')}</div>` : ''}
    </div>
  `;
  if(isAdmin){
    const actions = document.createElement('div');
    actions.className = 'row-actions';
    actions.innerHTML = `
      <button class="icon-btn edit-btn">✏️</button>
      <button class="icon-btn danger del-btn">🗑️</button>
    `;
    actions.querySelector('.edit-btn').onclick = () => { editingId = p.id; addingNew = false; render(); };
    actions.querySelector('.del-btn').onclick = () => confirmDelete(p);
    row.appendChild(actions);
  }
  return row;
}

function renderEditRow(p, catHint, isNew){
  const row = document.createElement('div');
  row.className = 'edit-row' + (isNew ? ' new' : '');
  const categories = Array.from(new Set([...CATEGORY_ORDER, ...products.map(x=>x.category)]));
  const catOptions = categories.map(c => `<option value="${escapeHtml(c)}" ${c === (p.category||catHint) ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
  row.innerHTML = `
    <div class="field-wrap">
      <p class="field-label">Category</p>
      <select class="field" id="f-cat">${catOptions}</select>
    </div>
    <div class="field-wrap">
      <p class="field-label">Product name</p>
      <input class="field" id="f-name" placeholder="e.g. Chief" value="${escapeHtml(p.name)}">
    </div>
    <div class="field-wrap">
      <p class="field-label">Active ingredient (optional)</p>
      <input class="field" id="f-ai" placeholder="e.g. Chlorpyriphos 50% + Cypermethrin 5% EC" value="${escapeHtml(p.ai||'')}">
    </div>
    <div class="field-wrap">
      <p class="field-label">Pack size</p>
      <input class="field" id="f-pack" placeholder="e.g. 1 LTR (PET)" value="${escapeHtml(p.pack)}">
    </div>
    <div class="two-col field-wrap">
      <div>
        <p class="field-label">Rate/LTR-KG ₹ (excl. GST)</p>
        <input class="field" id="f-price" type="number" inputmode="decimal" value="${p.price}">
      </div>
      <div>
        <p class="field-label">Pack price (auto)</p>
        <div class="field" id="f-unit-view" style="display:flex; align-items:center; color:var(--chalk-amber); font-family:'Oswald',sans-serif; font-size:16px;">—</div>
      </div>
    </div>
    <div class="two-col field-wrap">
      <div>
        <p class="field-label">GST rate</p>
        <input class="field" id="f-gst" placeholder="e.g. 18%" value="${escapeHtml(p.gst||'')}">
      </div>
      <div></div>
    </div>
    <div class="edit-actions">
      <button class="btn btn-save" id="saveBtn">${isNew ? 'Add product' : 'Save'}</button>
      <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
    </div>
  `;
  const priceField = row.querySelector('#f-price');
  const packField = row.querySelector('#f-pack');
  const unitView = row.querySelector('#f-unit-view');
  function refreshUnit(){
    const r = Number(priceField.value);
    const calc = (priceField.value !== '' && !Number.isNaN(r)) ? computePackPrice(r, packField.value) : null;
    unitView.textContent = calc == null ? '—' : '₹' + formatPrice(calc);
  }
  priceField.addEventListener('input', refreshUnit);
  packField.addEventListener('input', refreshUnit);
  refreshUnit();

  row.querySelector('#saveBtn').onclick = async () => {
    const category = row.querySelector('#f-cat').value;
    const name = row.querySelector('#f-name').value.trim();
    const ai = row.querySelector('#f-ai').value.trim();
    const pack = row.querySelector('#f-pack').value.trim();
    const price = row.querySelector('#f-price').value.trim();
    const gst = row.querySelector('#f-gst').value.trim();
    if(!name || !pack || price === '' || Number.isNaN(Number(price))){
      showToast('Enter a product name, pack size, and valid rate');
      return;
    }
    const gstMult = gst === '5%' ? 1.05 : 1.18;
    const incl = Math.round(Number(price) * gstMult * 100) / 100;
    const autoUnit = computePackPrice(Number(price), pack);
    const unitVal = autoUnit != null ? autoUnit : (p.unitPrice != null ? p.unitPrice : null);
    if(isNew){
      products.unshift({id: genId(), category, name, ai, pack, price: Number(price), unitPrice: unitVal, priceIncl: incl, gst: gst||null, updated:true});
      addingNew = false;
      await saveCatalog();
      showToast('Product added');
    } else {
      const idx = products.findIndex(x => x.id === p.id);
      let saved = null;
      if(idx > -1){
        const changed = products[idx].price !== Number(price);
        products[idx] = {...products[idx], category, name, ai, pack, price: Number(price), unitPrice: unitVal, priceIncl: incl, gst: gst||null, updated: changed ? true : products[idx].updated};
        saved = products[idx];
      }
      editingId = null;
      const isBase = packFraction(pack) === 1;
      const hasSiblings = saved && cascadeTargets(saved, Number(price), detectPackType(saved)).length > 0;
      if(isBase && hasSiblings){
        render();
        showCascadeModal(saved, Number(price), gst, async (didAll) => {
          await saveCatalog();
          showToast(didAll ? 'All pack sizes updated' : 'Rate saved');
          render();
        });
        return;
      }
      await saveCatalog();
      showToast('Rate saved');
    }
    render();
  };
  row.querySelector('#cancelBtn').onclick = () => {
    if(isNew){ addingNew = false; } else { editingId = null; }
    render();
  };
  return row;
}

function confirmDelete(p){
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <h2>Remove product?</h2>
        <p>"${escapeHtml(p.name)} — ${escapeHtml(p.pack)}" will be removed from the board for everyone.</p>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="delCancel">Cancel</button>
          <button class="btn" style="background:var(--brick); color:#fff" id="delConfirm">Remove</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('delCancel').onclick = () => modalRoot.innerHTML = '';
  document.getElementById('delConfirm').onclick = async () => {
    products = products.filter(x => x.id !== p.id);
    modalRoot.innerHTML = '';
    await saveCatalog();
    showToast('Product removed');
    render();
  };
}

addFab.onclick = () => { addingNew = true; editingId = null; render(); window.scrollTo({top:0, behavior:'smooth'}); };

searchEl.oninput = (e) => { query = e.target.value; render(); };

// --- Boss mode / PIN ---
async function getPin(){
  try{ return await dbGet('adminPin'); } catch(e){ return null; }
}
async function setPin(pin){
  await dbSet('adminPin', pin);
}

lockBtn.onclick = async () => {
  if(isAdmin){ exitAdminMode(); return; }
  const existingPin = await getPin();
  showPinModal(!existingPin);
};
document.getElementById('exitAdmin').onclick = exitAdminMode;

function exitAdminMode(){
  isAdmin = false;
  editingId = null;
  addingNew = false;
  render();
}

function showPinModal(isSetup){
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <h2>${isSetup ? 'Set a boss PIN' : 'Enter boss PIN'}</h2>
        <p>${isSetup ? 'This PIN unlocks editing for whoever knows it. Share it only with the boss / whoever sets prices.' : 'Enter the PIN to unlock editing.'}</p>
        <div class="modal-error" id="pinError" style="display:none">Incorrect PIN</div>
        <input class="pin-input" id="pinField" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
        <div class="modal-actions">
          <button class="btn btn-cancel" id="pinCancel">Cancel</button>
          <button class="btn btn-save" id="pinSubmit">${isSetup ? 'Set PIN' : 'Unlock'}</button>
        </div>
      </div>
    </div>
  `;
  const field = document.getElementById('pinField');
  field.focus();
  document.getElementById('pinCancel').onclick = () => modalRoot.innerHTML = '';
  document.getElementById('pinSubmit').onclick = async () => {
    const val = field.value.trim();
    if(val.length < 4){
      document.getElementById('pinError').textContent = 'PIN must be at least 4 digits';
      document.getElementById('pinError').style.display = 'block';
      return;
    }
    if(isSetup){
      await setPin(val);
      isAdmin = true;
      modalRoot.innerHTML = '';
      render();
      showToast('Boss PIN set — editing unlocked');
    } else {
      const real = await getPin();
      if(val === real){
        isAdmin = true;
        modalRoot.innerHTML = '';
        render();
        showToast('Editing unlocked');
      } else {
        document.getElementById('pinError').style.display = 'block';
        field.value = '';
        field.focus();
      }
    }
  };
  field.onkeydown = (e) => { if(e.key === 'Enter') document.getElementById('pinSubmit').click(); };
}

function startPolling(){
  if(polling) clearInterval(polling);
  polling = setInterval(() => {
    if(editingId === null && !addingNew){
      loadCatalog(true);
    }
  }, 7000);
}

(async function init(){
  await loadCatalog();
  startPolling();
  setInterval(() => { if(lastUpdated) syncText.textContent = 'updated ' + relTime(lastUpdated); }, 15000);
})();
</script>
</body>
